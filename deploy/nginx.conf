# LTN 影音 — 靜態站 + /hls 同源代理（Nginx）
#
# 背景：
#   專案以 output:"export" 產生純靜態檔到 out/。
#   影片走 HLS，網址在前端被改寫成同源路徑 /hls/...（見 app/page.tsx）。
#   上游 https://video.ltn.com.tw/media/* 沒有開 CORS，瀏覽器不能直連，
#   因此這裡用 Nginx 同源反向代理把 /hls/* 轉到上游，重現 next dev 的那條 rewrite。
#
# 部署：
#   1) npm run build           # 產生 out/
#   2) 把 out/ 整個放到下方 root 指的路徑（例如 /var/www/ltn-video）
#   3) 把這個 server 區塊貼進 Nginx 設定（或 include 此檔），reload nginx
#
# 對應關係：/hls/abc/index.m3u8  ->  https://video.ltn.com.tw/media/abc/index.m3u8
#
# 本檔提供兩種情境，擇一使用：
#   情境 A（HTTP）：測試機只跑 80 埠、沒有憑證 → 用最下方的「純 HTTP」server。
#   情境 B（HTTPS）：正式機有網域與憑證 → 用「HTTP 轉址 + HTTPS」兩個 server。
# 兩種情境的 /hls 代理與靜態檔設定完全相同，差別只在 listen / ssl。


# =====================================================================
# 情境 A：純 HTTP（測試 / 內網用）
# =====================================================================
server {
    listen 80;
    server_name _;            # 換成你的網域，例如 video-test.example.com

    # 靜態站根目錄：指向 build 出來的 out/
    root /var/www/ltn-video;  # ← 改成你實際放 out/ 的路徑
    index index.html;

    # --- HLS 同源代理：/hls/* -> video.ltn.com.tw/media/* ---
    # location 與 proxy_pass 都帶結尾斜線，Nginx 會把 /hls/ 換成 /media/
    location /hls/ {
        proxy_pass https://video.ltn.com.tw/media/;

        # 上游用 SNI 的 HTTPS，必須帶正確 Host 與開啟 server_name
        proxy_set_header Host video.ltn.com.tw;
        proxy_ssl_server_name on;

        # 不要把瀏覽器的 Origin/Referer 轉給上游，避免被擋
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        # 串流不需要快取；同源其實用不到 CORS，補著以防萬一
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;

        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # --- 影片詳細頁 SPA fallback ---
    # build 當下已知的影片有預先產生的資料夾，正常命中；build 之後後端才新增、
    # 沒有檔案的影片，改回傳 client 外殼頁 /video-fallback/，由它讀網址 id 即時
    # 抓 API 渲染（回 200，讓外殼能正常運作）。這樣新影片免重 build 也不會 404。
    location ~ ^/(programs/[^/]+/video|topic/video)/ {
        try_files $uri $uri/ $uri/index.html /video-fallback/index.html;
    }

    # --- shorts 單則 SPA fallback ---
    # /shorts/{id} 不預先產生，找不到檔案時回 /shorts/ 外殼（200），
    # 由 ShortsFeed 讀網址 id 跳到該則。
    location ~ ^/shorts/[^/]+/ {
        try_files $uri $uri/ $uri/index.html /shorts/index.html;
    }

    # --- 節目分類頁 SPA fallback ---
    # build 後才新增的節目 /programs/{新key} 沒有檔案時，回 /programs/_shell 外殼，
    # 由分類頁讀網址 key 即時抓後端。只比對單層分類頁（結尾就是 key），
    # /programs/{key}/video/... 由上面的影片 fallback 處理。
    location ~ ^/programs/[^/]+/?$ {
        try_files $uri $uri/ $uri/index.html /programs/_shell/index.html;
    }

    # --- 靜態檔（trailingSlash:true：內頁是資料夾 + index.html）---
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    # 找不到頁面時回 next export 產生的 404.html
    error_page 404 /404.html;
}


