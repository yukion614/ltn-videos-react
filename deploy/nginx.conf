# LTN 影音 — Nginx 反向代理（前面擋 Next.js Node 伺服器）
#
# 背景：
#   本站以 SSR + ISR 運作（見 next.config.ts 的說明），在 EC2 上跑 `next start`
#   （預設 127.0.0.1:3000），Nginx 只負責對外收 80/443、轉給它。
#   路由（含 /programs/{key}/video/{id}、/shorts/{id} 這類動態頁）一律由 Next 處理，
#   Nginx 不再需要任何 SPA fallback / try_files 規則。
#
# 部署：
#   1) npm ci && npm run build
#   2) 用 pm2 / systemd 常駐 `npm run start`（監聽 127.0.0.1:3000）
#   3) 把下方 server 區塊貼進 Nginx 設定（或 include 此檔），reload nginx
#
# 本檔提供兩種情境，擇一使用：
#   情境 A（HTTP）：測試機只跑 80 埠、沒有憑證。
#   情境 B（HTTPS）：正式機有網域與憑證 → 用「HTTP 轉址 + HTTPS」兩個 server。


# 上游：Next.js 伺服器
upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 轉給 Next 的共用標頭。Next 依 X-Forwarded-* 判斷對外的協定與主機，
# 少了它們，伺服器端算出來的絕對網址（og:url / canonical / 轉址）會變成 http://localhost:3000。
# 用 map 讓 Connection 在 WebSocket（next dev 的 HMR）時正確升級。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# =====================================================================
# 情境 A：純 HTTP（測試 / 內網用）
# =====================================================================
server {
    listen 80;
    server_name _;            # 換成你的網域，例如 video-test.example.com

    # 上傳大小與逾時：影片頁只是 HTML，預設值即可，這裡放寬 proxy 讀取逾時
    proxy_read_timeout 60s;

    # Next 的靜態資產（build 產物）帶著內容雜湊，可以長期強快取
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- HLS 同源代理：/hls/* -> video.ltn.com.tw/media/* ---
    # 上游只對 *.ltn.com.tw 開 CORS。正式站部署在 ltn.com.tw 子網域時其實可直連，
    # 這條留著當保險（也對齊 next.config.ts 的 dev rewrite）。
    # location 與 proxy_pass 都帶結尾斜線，Nginx 會把 /hls/ 換成 /media/
    location /hls/ {
        proxy_pass https://video.ltn.com.tw/media/;

        # 上游用 SNI 的 HTTPS，必須帶正確 Host 與開啟 server_name
        proxy_set_header Host video.ltn.com.tw;
        proxy_ssl_server_name on;

        # 不要把瀏覽器的 Origin/Referer 轉給上游，避免被擋
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        # 串流不需要快取；同源其實用不到 CORS，補著以防萬一
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;

        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # --- 其餘一律轉給 Next（頁面、API、圖片、public/ 檔案）---
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}


# =====================================================================
# 情境 B：HTTPS（正式機）— 啟用前請把上面情境 A 的 server 區塊註解掉
